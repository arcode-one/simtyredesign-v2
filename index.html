<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#1e1f22" />
		<title>СИМТИ — редизайн</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="app" id="app">
			<nav class="rail" aria-label="Серверы">
				<button
					class="rail-item rail-home active"
					data-space="home"
					aria-label="Личные сообщения"
				>
					<svg><use href="#icon-chat"></use></svg
					><span class="rail-tip">Личные сообщения</span>
				</button>
				<div class="rail-line"></div>
				<button
					class="rail-item server-mark"
					data-space="server"
					aria-label="Сервер Simty Upgrade"
				>
					<span>S</span><span class="rail-tip">Simty Upgrade</span>
				</button>
				<button
					class="rail-item rail-add"
					data-modal="create-server"
					aria-label="Создать сервер"
				>
					<svg><use href="#icon-plus"></use></svg
					><span class="rail-tip">Создать сервер</span>
				</button>
			</nav>

			<aside class="sidebar" id="sidebar">
				<header class="sidebar-head" id="sidebarHead"></header>
				<div class="sidebar-body" id="sidebarBody"></div>
				<div class="active-call-dock-host" id="activeCallDock"></div>
				<footer class="user-panel">
					<button class="user-identity" aria-label="Профиль пользователя">
						<span class="avatar avatar-main">A</span>
						<span class="user-name"><strong>ArCode</strong></span>
					</button>
					<div class="user-actions">
						<button
							class="icon-button"
							data-state="mic"
							aria-label="Микрофон включен"
						>
							<svg><use href="#icon-mic"></use></svg>
						</button>
						<button
							class="icon-button"
							data-state="sound"
							aria-label="Звук включен"
						>
							<svg><use href="#icon-volume"></use></svg>
						</button>
						<button
							class="icon-button"
							data-modal="user-settings"
							aria-label="Настройки пользователя"
						>
							<svg><use href="#icon-settings"></use></svg>
						</button>
					</div>
				</footer>
			</aside>

			<main class="main">
				<header class="main-head" id="mainHead"></header>
				<section class="main-view" id="mainView" aria-live="polite"></section>
				<form class="composer hidden" id="composer">
					<div class="reply-preview" id="replyPreview" aria-live="polite"></div>
					<div class="composer-row">
						<button
							class="composer-side"
							type="button"
							aria-label="Прикрепить файл"
							data-toast="Выберите файл"
						>
							<svg><use href="#icon-paperclip"></use></svg>
						</button>
						<div class="composer-input">
							<textarea
								id="messageInput"
								rows="1"
								placeholder="Написать сообщение..."
							></textarea>
							<button
								class="icon-button"
								type="button"
								aria-label="Стикеры"
								data-action="stickers"
							>
								<svg><use href="#icon-sticker"></use></svg>
							</button>
						</div>
						<button
							class="voice-button"
							type="button"
							aria-label="Записать голосовое сообщение"
							data-action="voice"
						>
							<svg><use href="#icon-mic"></use></svg>
						</button>
					</div>
					<div class="sticker-popover" id="stickerPopover">
						<button type="button">👋</button><button type="button">💜</button
						><button type="button">🔥</button><button type="button">✨</button>
					</div>
				</form>
			</main>

			<aside class="info-drawer" id="infoDrawer"></aside>
			<button
				class="mobile-backdrop"
				id="mobileBackdrop"
				aria-label="Закрыть меню"
			></button>
		</div>

		<div class="modal-root" id="modalRoot"></div>
		<div class="mobile-notification-prompt" id="mobileNotificationPrompt" aria-hidden="true"></div>
		<div class="message-stack" id="messageStack" aria-live="polite" aria-atomic="false"></div>

		<svg class="sprite" aria-hidden="true">

					d="M5 18.5 3.5 21l3.8-1.1c1.4.7 3 1.1 4.7 1.1 5 0 9-3.8 9-8.5S17 4 12 4s-9 3.8-9 8.5c0 2.3.9 4.4 2 6Z"
				/>
				<path d="M8 12.5h.01M12 12.5h.01M16 12.5h.01" />
			</symbol>
			<symbol id="icon-plus" viewBox="0 0 24 24">
				<path d="M12 5v14M5 12h14" />
			</symbol>
			<symbol id="icon-users" viewBox="0 0 24 24">
				<circle cx="9" cy="8" r="3" />
				<path
					d="M3 19v-1a5 5 0 0 1 10 0v1M16 11a3 3 0 1 0 0-6M16 14a5 5 0 0 1 5 5"
				/>
			</symbol>
			<symbol id="icon-bookmark" viewBox="0 0 24 24">

			</symbol>
			<symbol id="icon-mic" viewBox="0 0 24 24">

			</symbol>
			<symbol id="icon-volume" viewBox="0 0 24 24">

				<path d="M17 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12" />
			</symbol>
			<symbol id="icon-settings" viewBox="0 0 24 24">

				<path
					d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3A1.7 1.7 0 0 0 14 21v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"
				/>
			</symbol>
			<symbol id="icon-chevron" viewBox="0 0 24 24">

			</symbol>
			<symbol id="icon-bell" viewBox="0 0 24 24">

			<symbol id="icon-at" viewBox="0 0 24 24">

			<symbol id="icon-paperclip" viewBox="0 0 24 24">

					d="m20 11-8.5 8.5a5 5 0 0 1-7-7L14 3a3.5 3.5 0 0 1 5 5l-9.5 9.5a2 2 0 0 1-3-3L15 6"
				/>
			</symbol>
			<symbol id="icon-send" viewBox="0 0 24 24">
				<path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904Z" />

			<symbol id="icon-sticker" viewBox="0 0 24 24">

				<path d="M14 21v-5a2 2 0 0 1 2-2h5M8 9h.01M15 9h.01M8 14c2 2 6 2 8 0" />
			</symbol>
			<symbol id="icon-close" viewBox="0 0 24 24">
				<path d="m6 6 12 12M18 6 6 18" />
			</symbol>
			<symbol id="icon-lock" viewBox="0 0 24 24">
				<rect x="4" y="10" width="16" height="11" rx="2" />
				<path d="M8 10V7a4 4 0 0 1 8 0v3" />
			</symbol>
			<symbol id="icon-user-check" viewBox="0 0 24 24">
				<circle cx="9" cy="8" r="3" />
				<path d="M3 19v-1a5 5 0 0 1 10 0v1M16 11l2 2 4-5" />
			</symbol>
			<symbol id="icon-globe" viewBox="0 0 24 24">
				<circle cx="12" cy="12" r="9" />
				<path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" />
			</symbol>
			<symbol id="icon-search" viewBox="0 0 24 24">
				<circle cx="11" cy="11" r="7" />
				<path d="m20 20-4-4" />
			</symbol>
			<symbol id="icon-copy" viewBox="0 0 24 24">

			</symbol>
			<symbol id="icon-image" viewBox="0 0 24 24">

			</symbol>
			<symbol id="icon-file" viewBox="0 0 24 24">
				<path d="M6 3h8l4 4v14H6z" />

			</symbol>

			</symbol>
			<symbol id="icon-role" viewBox="0 0 24 24">
				<circle cx="12" cy="8" r="4" />
				<path d="m8 13-2 8 6-3 6 3-2-8" />
			</symbol>
			<symbol id="icon-link" viewBox="0 0 24 24">

					d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"
				/>
			</symbol>
			<symbol id="icon-list" viewBox="0 0 24 24">
				<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" />
			</symbol>
			<symbol id="icon-trash" viewBox="0 0 24 24">
				<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6" />

				<path d="M4 12h9a7 7 0 0 1 7 7v1" />
			</symbol>
			<symbol id="icon-edit" viewBox="0 0 24 24">
				<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497Z" />
				<path d="m15 5 4 4" />
			</symbol>
			<symbol id="icon-pin" viewBox="0 0 24 24">
				<path d="M12 17v5" />
				<path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1Z" />
			</symbol>
			<symbol id="icon-monitor" viewBox="0 0 24 24">
				<rect x="3" y="4" width="18" height="13" rx="2" />
				<path d="M8 21h8M12 17v4" />
			</symbol>
			<symbol id="icon-maximize" viewBox="0 0 24 24">
				<path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />

				<path d="M3 6h7l2 2h9v11H3z" />
			</symbol>
			<symbol id="icon-menu" viewBox="0 0 24 24">
				<path d="M4 7h16M4 12h16M4 17h16" />
			</symbol>
			<symbol id="icon-arrow-left" viewBox="0 0 24 24">

			</symbol>

				<path d="m16 17 5-5-5-5M21 12H9" />
			</symbol>
			<symbol id="icon-warning" viewBox="0 0 24 24">
				<path
					d="M10.3 4.2 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0Z"
				/>
				<path d="M12 9v4M12 17h.01" />

			<symbol id="icon-refresh" viewBox="0 0 24 24">
				<path d="M21 12a9 9 0 0 0-15.2-6.5L3 8" />

				<path d="M3 12a9 9 0 0 0 15.2 6.5L21 16" />
				<path d="M16 16h5v5" />

			<symbol id="icon-check" viewBox="0 0 24 24">
				<path d="m5 12 4 4L19 6" />
			</symbol>
			<symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
			<symbol id="icon-slash" viewBox="0 0 24 24">
				<path d="M7 21 17 3" />
			</symbol>
			<symbol id="icon-clock" viewBox="0 0 24 24">
				<circle cx="12" cy="12" r="9" />

			<symbol id="icon-bell-off" viewBox="0 0 24 24">
				<path
					d="m3 3 18 18M18 8a6 6 0 0 0-9.5-4.9M6 8c0 7-3 7-3 9h14M10 21h4"
				/>
			</symbol>
			<symbol id="icon-server" viewBox="0 0 24 24">
				<rect x="3" y="4" width="18" height="7" rx="2" />
				<rect x="3" y="13" width="18" height="7" rx="2" />
				<path d="M7 7.5h.01M7 16.5h.01M11 7.5h6M11 16.5h6" />
			</symbol>
			<symbol id="icon-phone" viewBox="0 0 24 24">

					d="M5 4h4l2 5-2.5 1.8a15 15 0 0 0 4.7 4.7L15 13l5 2v4a2 2 0 0 1-2 2C9.7 21 3 14.3 3 6a2 2 0 0 1 2-2Z"
				/>
			</symbol>
			<symbol id="icon-camera" viewBox="0 0 24 24">

					d="M4 7h3l1.5-2h7L17 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"
				/>
				<circle cx="12" cy="13" r="4" />

			<symbol id="icon-user-x" viewBox="0 0 24 24">

				<path d="M3 19v-1a5 5 0 0 1 10 0v1M16 10l5 5M21 10l-5 5" />

			<symbol id="icon-more" viewBox="0 0 24 24">
				<circle cx="5" cy="12" r="1" />

			</symbol>
			<symbol id="icon-user-minus" viewBox="0 0 24 24">
				<circle cx="9" cy="8" r="3" />
				<path d="M3 19v-1a5 5 0 0 1 10 0v1M16 13h6" />

			<symbol id="icon-ban" viewBox="0 0 24 24">
				<circle cx="12" cy="12" r="9" />
				<path d="m6 6 12 12" />
			</symbol>
		</svg>

		<script src="app.js"></script>
	</body>
</html>
